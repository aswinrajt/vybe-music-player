<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vybe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="64" height="64" rx="18" fill="#0A0F1D" stroke="url(#vybe-grad)" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Subtle ambient inner glow -->
  <circle cx="32" cy="32" r="20" fill="url(#vybe-grad)" opacity="0.15" filter="url(#glow)" />
  
  <!-- VYBE sound frequency 'V' wave -->
  <path d="M14 22 L24 44 L32 28 L40 44 L50 22" stroke="url(#vybe-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central Pulse Accent -->
  <circle cx="32" cy="18" r="3" fill="#22D3EE" />
</svg>
